name: Build, Test & Publish Images

# Run on every PR/push to main so the gate always reports a result.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write
  pull-requests: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.AWS_OIDC_ROLE_ARN }}
  ECR_REPOSITORY: apha/cdc

jobs:
  lint:
    name: Lint & Build - Solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CDC.slnx

      - name: Verify formatting
        run: dotnet format CDC.slnx --verify-no-changes --no-restore

      - name: Build (enforces analyzers + code style)
        run: dotnet build CDC.slnx -c Release --no-restore

  # Disabled until SonarCloud is configured; change if: false when ready.
  sonarcloud:
    name: Static Analysis - SonarCloud
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"
          dotnet build CDC.slnx -c Release
          dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  # Both projects publish to apha/cdc using different image tag prefixes.
  changes:
    name: Detect Changed Projects
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          filters: |
            api:
              - 'src/CDC.Api/**'
            web:
              - 'src/CDC.Web/**'

  build-api:
    name: Build & Publish - CDC.Api
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # If IAM expects :environment:ecr-production, set environment here.
    # environment: ecr-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Display GitHub OIDC claims for troubleshooting
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::OIDC is unavailable. The calling job must grant id-token: write."
            exit 1
          fi

          echo "AWS region: ${AWS_REGION}"
          echo "Target AWS role: ${AWS_ROLE_ARN}"

          RESPONSE="$(curl --silent --show-error --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(printf '%s' "$RESPONSE" | jq -er '.value | select(type == "string" and length > 0)')"
          echo "::add-mask::${TOKEN}"
          PAYLOAD="$(printf '%s' "$TOKEN" | cut -d '.' -f 2)"

          TOKEN_PAYLOAD="$PAYLOAD" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN_PAYLOAD"]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          # Print only selected claims; never print the JWT or request token.
          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner_id",
              "repository_id",
              "ref",
              "event_name",
              "environment",
              "workflow_ref",
              "job_workflow_ref",
          ]:
              print(f"{key}={json.dumps(claims.get(key), ensure_ascii=True)}")
          PY

      - uses: ./.github/actions/build-test-publish
        with:
          project-dir: src/CDC.Api
          test-project: tests/CDC.Api.Tests/CDC.Api.Tests.csproj
          dockerfile: src/CDC.Api/Dockerfile
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          image-tag-prefix: api-
          git-tag-prefix: api
          cache-scope: cdc-api
          aws-region: ${{ env.AWS_REGION }}
          aws-role-arn: ${{ env.AWS_ROLE_ARN }}

  build-web:
    name: Build & Publish - CDC.Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    # If IAM expects :environment:ecr-production, set environment here.
    # environment: ecr-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Display GitHub OIDC claims for troubleshooting
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::OIDC is unavailable. The calling job must grant id-token: write."
            exit 1
          fi

          echo "AWS region: ${AWS_REGION}"
          echo "Target AWS role: ${AWS_ROLE_ARN}"

          RESPONSE="$(curl --silent --show-error --fail \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")"

          TOKEN="$(printf '%s' "$RESPONSE" | jq -er '.value | select(type == "string" and length > 0)')"
          echo "::add-mask::${TOKEN}"
          PAYLOAD="$(printf '%s' "$TOKEN" | cut -d '.' -f 2)"

          TOKEN_PAYLOAD="$PAYLOAD" python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["TOKEN_PAYLOAD"]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          # Print only selected claims; never print the JWT or request token.
          for key in [
              "iss",
              "aud",
              "sub",
              "repository",
              "repository_owner_id",
              "repository_id",
              "ref",
              "event_name",
              "environment",
              "workflow_ref",
              "job_workflow_ref",
          ]:
              print(f"{key}={json.dumps(claims.get(key), ensure_ascii=True)}")
          PY

      - uses: ./.github/actions/build-test-publish
        with:
          project-dir: src/CDC.Web
          test-project: tests/CDC.Web.Tests/CDC.Web.Tests.csproj
          dockerfile: src/CDC.Web/Dockerfile
          ecr-repository: ${{ env.ECR_REPOSITORY }}
          image-tag-prefix: web-
          git-tag-prefix: web
          cache-scope: cdc-web
          aws-region: ${{ env.AWS_REGION }}
          aws-role-arn: ${{ env.AWS_ROLE_ARN }}

  # Branch protection should require this gate; per-project jobs may skip.
  gate:
    name: PR Status Gate
    needs: [lint, sonarcloud, build-api, build-web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            exit 1
          fi