name: Build, Test and Publish CDC Images
 
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_release_type:
        description: API release increment; choose none when API is not being released
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      web_release_type:
        description: Web release increment; choose none when Web is not being released
        required: true
        default: none
        type: choice
        options:
          - none
          - patch
          - minor
          - major
 
# Pull-request release-label contract:
# - API: release:api:patch, release:api:minor or release:api:major
# - Web: release:web:patch, release:web:minor or release:web:major
# A changed component requires exactly one matching label. Release labels for
# unchanged components are ignored with a warning.
#
# Dynamic semantic-version rules:
# - No existing tag + patch = 0.0.1
# - No existing tag + minor = 0.1.0
# - api-v0.1.0 + patch = api-v0.1.1
# - api-v0.1.0 + minor = api-v0.2.0
# - api-v0.2.0 + patch = api-v0.2.1
# - web follows the same independent sequence.
#
# Production releases are serialized so two merges cannot calculate the same
# next semantic version. Pull-request validation remains independently cancellable.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('cdc-pr-{0}', github.ref) || 'cdc-production-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
 
env:
  DOTNET_VERSION: "10.0.x"
 
jobs:
  changes:
    name: Detect affected components
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      components: ${{ steps.components.outputs.result }}
      dockerfiles: ${{ steps.dockerfiles.outputs.map }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
 
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            api:
              - 'src/CDC.Api/**'
              - 'tests/CDC.Api.Tests/**'
              - 'src/CDC.Common/**'
              - 'CDC.slnx'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'global.json'
              - '.github/workflows/build-test-publish-images.yml'
              - '.github/actions/**'
              - '.github/scripts/**'
            web:
              - 'src/CDC.Web/**'
              - 'tests/CDC.Web.Tests/**'
              - 'src/CDC.Common/**'
              - 'src/CDC.Auth.Cidm/**'
              - 'tests/CDC.Auth.Cidm.Tests/**'
              - 'src/CDC.Auth.Entra/**'
              - 'tests/CDC.Auth.Entra.Tests/**'
              - 'CDC.slnx'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'NuGet.config'
              - 'global.json'
              - '.github/workflows/build-test-publish-images.yml'
              - '.github/actions/**'
              - '.github/scripts/**'
 
      - name: Resolve affected components
        id: components
        shell: bash
        env:
          API_RELEASE_TYPE: ${{ inputs.api_release_type }}
          WEB_RELEASE_TYPE: ${{ inputs.web_release_type }}
          FILTER_CHANGES: ${{ steps.filter.outputs.changes }}
        run: bash .github/scripts/ci/resolve-components.sh
 
      - name: Map components to Dockerfiles
        id: dockerfiles
        shell: bash
        run: |
          echo 'map={"api":"src/CDC.Api/Dockerfile","web":"src/CDC.Web/Dockerfile"}' >> "${GITHUB_OUTPUT}"
 
  release-label-validation:
    name: Validate component release labels
    needs: [changes]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    env:
      COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
      LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
    steps:
      - name: Enforce component-specific release labels
        shell: bash
        run: |
          set -euo pipefail
 
          jq -e 'type == "array"' <<< "${COMPONENTS_JSON}" >/dev/null
          jq -e 'type == "array"' <<< "${LABELS_JSON}" >/dev/null
 
          mapfile -t GENERIC_LABELS < <(
            jq -r '.[]' <<< "${LABELS_JSON}" |
              grep -E '^release:(patch|minor|major)$' || true
          )
 
          if (( ${#GENERIC_LABELS[@]} > 0 )); then
            echo "::error::Generic release labels are not allowed. Use release:api:* or release:web:* labels."
            exit 1
          fi
 
          validate_component() {
            local component="$1"
            local changed="false"
            local labels=()
 
            if jq -e --arg component "${component}" 'index($component) != null' \
              <<< "${COMPONENTS_JSON}" >/dev/null; then
              changed="true"
            fi
 
            mapfile -t labels < <(
              jq -r '.[]' <<< "${LABELS_JSON}" |
                grep -E "^release:${component}:(patch|minor|major)$" || true
            )
 
            if [[ "${changed}" == "true" && "${#labels[@]}" -ne 1 ]]; then
              echo "::error::Changed ${component} requires exactly one release:${component}:patch, release:${component}:minor or release:${component}:major label."
              return 1
            fi
 
            if [[ "${changed}" == "false" && "${#labels[@]}" -ne 0 ]]; then
              echo "::warning::${component} did not change; ignoring its release label(s)."
            fi
          }
 
          validate_component api
          validate_component web
          echo "Component release labels match the changed paths."
 
  quality:
    name: Format, build and test solution
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
 
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
 
      - name: Restore solution
        run: dotnet restore CDC.slnx
 
      - name: Verify formatting
        run: dotnet format CDC.slnx --verify-no-changes --no-restore
 
      - name: Build solution
        run: dotnet build CDC.slnx --configuration Release --no-restore --warnaserror
 
      - name: Test solution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # coverlet.msbuild 10.0.1 intermittently throws "Unable to read beyond the end of the
          # stream" while calculating coverage results on .NET 10 SDK runners - all tests still
          # pass, only coverlet's own post-test report generation fails (confirmed upstream, closed
          # "not planned": https://github.com/coverlet-coverage/coverlet/issues/1957). Retry rather
          # than fail the build on this known, transient third-party issue.
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            dotnet test CDC.slnx `
              --configuration Release `
              --no-build `
              --no-restore `
              --logger "trx;LogFilePrefix=cdc-tests" `
              --results-directory "${{ runner.temp }}/test-results"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq $maxAttempts) { exit $LASTEXITCODE }
            Write-Warning "dotnet test failed (attempt $attempt of $maxAttempts, exit code $LASTEXITCODE) - retrying."
            Start-Sleep -Seconds 5
          }
 
  sonarcloud:
    name: SonarCloud analysis
    if: vars.SONAR_ENABLED == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
 
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
 
      - name: Set up Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "17"
 
      - name: Cache SonarCloud packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
 
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
 
      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -Path "${{ runner.temp }}\scanner" -ItemType Directory -Force | Out-Null
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}\scanner"
 
      - name: Restore solution
        run: dotnet restore CDC.slnx
 
      - name: Analyse solution
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: ""
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SONAR_TOKEN}"
 
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"${{ vars.SONAR_PROJECT_KEY }}" \
            /o:"${{ vars.SONAR_ORGANIZATION }}" \
            /s:"${{ github.workspace }}\SonarQube.Analysis.xml" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true
 
          dotnet build CDC.slnx --configuration Release --no-restore
 
          # coverlet.msbuild 10.0.1 intermittently throws "Unable to read beyond the end of the
          # stream" after tests pass (https://github.com/coverlet-coverage/coverlet/issues/1957).
          # Retry rather than fail the analysis on this known, transient third-party issue.
          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            if dotnet test CDC.slnx \
              --configuration Release \
              --no-restore \
              --logger "trx;LogFilePrefix=cdc-sonar-tests" \
              --results-directory "${{ runner.temp }}/test-results" \
              /p:Threshold=0; then
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then exit 1; fi
            echo "::warning::dotnet test failed (attempt ${attempt} of ${max_attempts}) - retrying."
            sleep 5
          done
 
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end \
            /d:sonar.token="${SONAR_TOKEN}"
 
  security-scans:
    name: Security scans
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-scans.yml
 
  container-validation:
    name: Validate ${{ matrix.component }} container
    needs: [changes, quality]
    if: needs.changes.outputs.components != '[]'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      DOCKERFILE: ${{ fromJSON(needs.changes.outputs.dockerfiles)[matrix.component] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
 
      - name: Validate resolved Dockerfile path
        if: env.DOCKERFILE == ''
        shell: bash
        run: |
          echo "::error::No Dockerfile is mapped for component '${{ matrix.component }}'."
          exit 1
 
      # Baked into the image by the component Dockerfiles - never committed to source, fetched here
      # from a GitHub secret so the build context has it before `docker build` runs.
      - name: Install FortiGate TLS-inspection CA certificates
        id: fortigate-ca
        uses: ./.github/actions/install-fortigate-ca
        with:
          root-ca-cert-base64: ${{ secrets.FORTIGATE_ROOT_CA_CERT_BASE64 }}
          ca-cert-base64: ${{ secrets.FORTIGATE_CA_CERT_BASE64 }}
 
      - name: Remove unsupported NuGet cache mounts
        uses: ./.github/actions/strip-nuget-cache-mount
        with:
          dockerfile: ${{ env.DOCKERFILE }}
 
      - name: Start Docker service
        uses: ./.github/actions/start-docker
 
      - name: Build container without publishing
        shell: pwsh
        run: |
          $dockerArgs = @(
            "build"
            "--file"
            "${{ env.DOCKERFILE }}"
            "--tag"
            "cdc-${{ matrix.component }}:$env:GITHUB_SHA"
            "--label"
            "org.opencontainers.image.revision=$env:GITHUB_SHA"
            "--label"
            "org.opencontainers.image.source=https://github.com/$env:GITHUB_REPOSITORY"
            "."
          )
 
          docker @dockerArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
 
      - name: Verify FortiGate CA chain is trusted in image
        uses: ./.github/actions/verify-fortigate-ca-in-image
        with:
          image: cdc-${{ matrix.component }}:${{ github.sha }}
          root-thumbprint: ${{ steps.fortigate-ca.outputs.root_thumbprint }}
          subca-thumbprint: ${{ steps.fortigate-ca.outputs.thumbprint }}
 
      - name: Save validated image for publishing
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          docker save "cdc-${{ matrix.component }}:$env:GITHUB_SHA" `
            -o "${{ runner.temp }}/cdc-${{ matrix.component }}.tar"
 
      - name: Upload validated image artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cdc-image-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ runner.temp }}/cdc-${{ matrix.component }}.tar
          retention-days: 1
          overwrite: true
 
  release-version:
    name: Calculate component release versions
    needs: [changes]
    if: >-
      needs.changes.outputs.components != '[]' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      versions: ${{ steps.version.outputs.versions }}
      git_tags: ${{ steps.version.outputs.git_tags }}
      release_types: ${{ steps.version.outputs.release_types }}
      pull_request: ${{ steps.version.outputs.pull_request }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
 
      - name: Calculate independent API and Web versions
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
          MANUAL_API_RELEASE_TYPE: ${{ inputs.api_release_type }}
          MANUAL_WEB_RELEASE_TYPE: ${{ inputs.web_release_type }}
        run: bash .github/scripts/release/release-version.sh
 
  publish:
    name: Publish ${{ matrix.component }} production image
    needs:
      - changes
      - quality
      - sonarcloud
      - security-scans
      - container-validation
      - release-version
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.quality.result == 'success' &&
      (vars.SONAR_ENABLED != 'true' || needs.sonarcloud.result == 'success') &&
      needs.security-scans.result == 'success' &&
      needs.container-validation.result == 'success' &&
      needs.release-version.result == 'success' &&
      needs.changes.outputs.components != '[]'
    runs-on: windows-2022
    environment: ecr-production
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      AWS_REGION: ${{ secrets.AWS_ENV_REGION }}
      AWS_ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ENV_ACCOUNT }}:role/${{ secrets.AWS_ENV_OIDC_ROLE }}
      EXPECTED_AWS_ACCOUNT_ID: ${{ vars.EXPECTED_AWS_ACCOUNT_ID }}
      EXPECTED_AWS_REGION: ${{ vars.EXPECTED_AWS_REGION }}
      ECR_API_REPOSITORY: ${{ vars.ECR_API_REPOSITORY }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      VERSIONS_JSON: ${{ needs.release-version.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
 
      - name: Resolve and validate publishing configuration
        id: component
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
        run: bash .github/scripts/publish/resolve-publish-config.sh
 
      - name: Download validated image artifact
        uses: actions/download-artifact@v4
        with:
          name: cdc-image-${{ matrix.component }}-${{ github.run_id }}
          path: ${{ runner.temp }}
 
      - name: Start Docker service
        uses: ./.github/actions/start-docker
 
      - name: Load validated image
        shell: pwsh
        run: docker load -i "${{ runner.temp }}/cdc-${{ matrix.component }}.tar"
 
      - name: Display OIDC claims for troubleshooting
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/publish/display-oidc-claims.sh
 
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cdc-${{ github.run_id }}-${{ matrix.component }}
          audience: sts.amazonaws.com
 
      - name: Verify assumed AWS account
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
 
          [[ "${ACTUAL_ACCOUNT_ID}" == "${EXPECTED_AWS_ACCOUNT_ID}" ]] || {
            echo "::error::The assumed AWS account does not match EXPECTED_AWS_ACCOUNT_ID."
            exit 1
          }
 
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          mask-password: true
 
      - name: Publish immutable versioned image
        id: image
        shell: bash
        env:
          COMPONENT: ${{ matrix.component }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.component.outputs.ecr_repository }}
          RELEASE_VERSION: ${{ steps.component.outputs.release_version }}
        run: bash .github/scripts/publish/publish-image.sh
 
      - name: Write publishing summary
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          CANDIDATE_TAG: ${{ steps.image.outputs.candidate_tag }}
          RELEASE_VERSION: ${{ steps.component.outputs.release_version }}
        run: |
          {
            echo "### CDC ${{ matrix.component }} production image"
            echo
            echo "- Release version: v${RELEASE_VERSION}"
            echo "- ECR release tag: ${IMAGE_TAG}"
            echo "- Image URI: ${IMAGE_URI}"
            echo "- Immutable digest: ${IMAGE_DIGEST}"
            echo "- Candidate tag: ${CANDIDATE_TAG}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
 
  gate:
    name: CI and publication gate
    needs:
      - changes
      - release-label-validation
      - quality
      - sonarcloud
      - security-scans
      - container-validation
      - release-version
      - publish
    if: always()
    runs-on: windows-2022
    timeout-minutes: 5
    permissions: {}
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      LABEL_RESULT: ${{ needs.release-label-validation.result }}
      QUALITY_RESULT: ${{ needs.quality.result }}
      SONAR_RESULT: ${{ needs.sonarcloud.result }}
      SECURITY_SCANS_RESULT: ${{ needs.security-scans.result }}
      CONTAINER_RESULT: ${{ needs.container-validation.result }}
      VERSION_RESULT: ${{ needs.release-version.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      COMPONENTS: ${{ needs.changes.outputs.components }}
      SONAR_ENABLED: ${{ vars.SONAR_ENABLED }}
      EVENT_NAME: ${{ github.event_name }}
      GIT_REF: ${{ github.ref }}
    steps:
      - name: Enforce required results
        shell: bash
        run: |
          set -euo pipefail
 
          [[ "${CHANGES_RESULT}" == "success" ]] || {
            echo "::error::Change detection result: ${CHANGES_RESULT}"
            exit 1
          }
 
          [[ "${QUALITY_RESULT}" == "success" ]] || {
            echo "::error::Quality result: ${QUALITY_RESULT}"
            exit 1
          }
 
          if [[ "${EVENT_NAME}" == "pull_request" && "${LABEL_RESULT}" != "success" ]]; then
            echo "::error::Component release-label validation result: ${LABEL_RESULT}"
            exit 1
          fi
 
          if [[ "${SONAR_ENABLED}" == "true" && "${SONAR_RESULT}" != "success" ]]; then
            echo "::error::SonarCloud is enabled but result is ${SONAR_RESULT}."
            exit 1
          fi
 
          [[ "${SECURITY_SCANS_RESULT}" == "success" ]] || {
            echo "::error::Security scans (secrets, dependencies, CodeQL) result: ${SECURITY_SCANS_RESULT}"
            exit 1
          }
 
          if [[ "${COMPONENTS}" != "[]" && "${CONTAINER_RESULT}" != "success" ]]; then
            echo "::error::Container validation result: ${CONTAINER_RESULT}"
            exit 1
          fi
 
          if [[ "${EVENT_NAME}" =~ ^(push|workflow_dispatch)$ && \
            "${GIT_REF}" == "refs/heads/main" && \
            "${COMPONENTS}" != "[]" ]]; then
            [[ "${VERSION_RESULT}" == "success" ]] || {
              echo "::error::Release-version result: ${VERSION_RESULT}"
              exit 1
            }
 
            [[ "${PUBLISH_RESULT}" == "success" ]] || {
              echo "::error::Image publication result: ${PUBLISH_RESULT}"
              exit 1
            }
          fi
 
          echo "All required CI and publication checks passed."
 
  finalise-release:
    name: Create immutable component Git tags
    needs:
      - changes
      - release-version
      - publish
      - gate
    if: >-
      always() &&
      needs.gate.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.release-version.result == 'success' &&
      needs.changes.outputs.components != '[]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
 
      - name: Create annotated component release tags
        id: tags
        shell: bash
        env:
          COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
          GIT_TAGS_JSON: ${{ needs.release-version.outputs.git_tags }}
          RELEASE_TYPES_JSON: ${{ needs.release-version.outputs.release_types }}
          PR_NUMBER: ${{ needs.release-version.outputs.pull_request }}
        run: bash .github/scripts/release/create-release-tags.sh
 
      - name: Write release summary
        shell: bash
        env:
          COMPONENTS_JSON: ${{ needs.changes.outputs.components }}
          GIT_TAGS_JSON: ${{ needs.release-version.outputs.git_tags }}
          RELEASE_TYPES_JSON: ${{ needs.release-version.outputs.release_types }}
        run: |
          {
            echo "### CDC production releases finalised"
            echo
            echo "| Component | Git tag | Increment |"
            echo "|---|---|---|"
 
            while IFS= read -r COMPONENT; do
              RELEASE_TAG="$(jq -er --arg component "${COMPONENT}" \
                '.[$component]' <<< "${GIT_TAGS_JSON}")"
              RELEASE_TYPE="$(jq -er --arg component "${COMPONENT}" \
                '.[$component]' <<< "${RELEASE_TYPES_JSON}")"
              echo "| ${COMPONENT} | ${RELEASE_TAG} | ${RELEASE_TYPE} |"
            done < <(jq -r '.[]' <<< "${COMPONENTS_JSON}")
 
            echo
            echo "- Commit: ${GITHUB_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
